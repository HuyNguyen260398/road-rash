# Allow native build scripts that Next.js/ESLint rely on:
#   sharp         — Next.js production image optimization
#   unrs-resolver — ESLint module resolution (eslint-config-next)
#   @swc/core     — Next.js compiler native package
#   @parcel/watcher — Turbopack/Next.js file watching native package
#   esbuild       — bundles the Lambda handlers (services/) for deployment
allowBuilds:
  "@parcel/watcher": true
  "@swc/core": true
  esbuild: true
  sharp: true
  unrs-resolver: true
